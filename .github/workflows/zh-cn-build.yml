name: zh-CN Build

on:
  push:
    branches: [zh-CN]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare native Chinese localizer
        shell: pwsh
        run: |
          $path = 'scripts/ApplyNativeChinese.ps1'
          $src = Get-Content $path -Raw
          $src = $src.Replace('function Apply-ExactSourceReplacements([string]$rel, [ordered]$replacements)', 'function Apply-ExactSourceReplacements([string]$rel, $replacements)')
          Set-Content -Path $path -Value $src -Encoding utf8

      - name: Apply native Simplified Chinese source
        shell: pwsh
        run: ./scripts/ApplyNativeChinese.ps1

      - name: Validate localized CSharp source
        shell: pwsh
        run: |
          $path = 'AnimeJaNaiConfEditor/Views/MainWindow.axaml.cs'
          $src = Get-Content $path -Raw
          # A translated string followed by the original concatenation operator can
          # temporarily produce '+ +'. Normalize that source-only artifact.
          $src = $src.Replace('+ +', '+')
          Set-Content -Path $path -Value $src -Encoding utf8

          # Guard against the old unsafe whole-source replacement failure mode.
          $all = Get-ChildItem AnimeJaNaiConfEditor -Recurse -Filter *.cs | ForEach-Object { Get-Content $_.FullName -Raw }
          $joined = $all -join "`n"
          foreach ($bad in @('View模型Base', '取消lationToken', 'SetLast错误')) {
            if ($joined.Contains($bad)) { throw "Unsafe localization touched a code identifier: $bad" }
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Publish Windows x64
        run: dotnet publish AnimeJaNaiConfEditor/AnimeJaNaiConfEditor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Stage runtime files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging | Out-Null
          Copy-Item publish\*.exe staging\
          Copy-Item publish\*.dll staging\
          Compress-Archive -Path staging\* -DestinationPath AnimeJaNaiManager-zh-CN-win-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeJaNaiManager-zh-CN-win-x64
          path: AnimeJaNaiManager-zh-CN-win-x64.zip
          if-no-files-found: error
